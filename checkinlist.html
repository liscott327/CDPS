<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人員簽到點收_列表</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        /* 廠區按鈕客製化樣式 */
        .btn-plant {
            border: 2px solid #212529;
            border-radius: 12px;
            padding: 12px 32px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #212529;
            background-color: #fff;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }

        .btn-plant:hover {
            background-color: #0d6efd;
            border-color: #0d6efd;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
        }

        /* 日期標題樣式 */
        .date-heading {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #343a40;
            border-left: 5px solid #0d6efd;
            padding-left: 12px;
            margin-bottom: 1rem;
        }

        /* TabView 頁籤導覽列樣式 */
        .navbar-nav-tabs .nav-link {
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.6rem 1.25rem;
            color: rgba(255, 255, 255, 0.7);
            border-radius: 6px 6px 0 0;
            margin-right: 4px;
            transition: all 0.2s ease-in-out;
            border-bottom: 3px solid transparent;
        }

        .navbar-nav-tabs .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .navbar-nav-tabs .nav-link.active {
            font-weight: 700;
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.12);
            border-bottom: 3px solid #0d6efd;
        }
    </style>
</head>

<body>

    <!-- 頂部共用導覽列 (Navbar TabView) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
        <div class="container px-4">
            <a class="navbar-brand d-flex align-items-center" href="index_BPM.html">
                <i class="bi bi-arrow-left-right text-primary me-2 fs-5"></i>
                <span>CPDS 跨廠人員調度與簽到系統</span>
            </a>

            <!-- 導覽列選單切換按鈕 (RWD 手型版) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMainCollapse"
                aria-controls="navbarMainCollapse" aria-expanded="false" aria-label="切換選單">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMainCollapse">
                <!-- 功能選單項目 (調度 / 簽到 / 報表) -->
                <ul class="navbar-nav navbar-nav-tabs me-auto ms-lg-4 mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" href="index_BPM.html">
                            <i class="bi bi-arrow-left-right me-1"></i>調度
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active d-flex align-items-center" aria-current="page" href="checkin.html">
                            <i class="bi bi-clipboard-check me-1"></i>簽到
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" href="report.html">
                            <i class="bi bi-file-earmark-bar-graph me-1"></i>報表
                        </a>
                    </li>
                </ul>

                <!-- 使用者身分資訊與登出按鈕注入點 -->
                <div id="navbarUserArea" class="ms-lg-auto">
                    <!-- 由 scripts/auth.js 動態渲染 -->
                </div>
            </div>
        </div>
    </nav>

    <div class="container px-4 py-4">

        <!-- 頁面主標題 -->
        <div class="mb-4 pb-2 border-bottom">
            <h2 class="fw-bold"><i class="bi bi-clipboard-data me-2 text-primary"></i>人員簽到點收_列表</h2>
        </div>

        <div class="row g-4">
            <!-- 左側：日期與對應廠區按鈕清單 -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4">

                        <!-- 2026/10/07 區塊 -->
                        <div class="mb-5">
                            <div class="date-heading">2026/10/07</div>
                            <div class="d-flex flex-wrap gap-3">
                                <!-- 實務上可透過 /CheckIn/Detail?date=2026-10-07&plant=A5-1 帶入參數 -->
                                <a href="#" class="btn-plant">A5-1</a>
                                <a href="#" class="btn-plant">A5-2</a>
                                <a href="#" class="btn-plant">A12-1</a>
                            </div>
                        </div>

                        <!-- 2026/10/08 區塊 -->
                        <div class="mb-2">
                            <div class="date-heading">2026/10/08</div>
                            <div class="d-flex flex-wrap gap-3">
                                <a href="#" class="btn-plant">A5-1</a>
                                <a href="#" class="btn-plant">A5-2</a>
                                <a href="#" class="btn-plant">A12-1</a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- 右側：調度計劃資訊面板 -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 bg-primary text-white h-100">
                    <div class="card-body p-4 d-flex flex-column">
                        <h5 class="fw-bold border-bottom border-light pb-3 mb-3">
                            <i class="bi bi-info-circle-fill me-2"></i>系統提示
                        </h5>

                        <!-- 依據原圖文字轉換為說明 -->
                        <p class="fs-5 lh-base mb-4">
                            此頁面列出近 3 天的各廠人員調度計劃。
                        </p>

                        <div class="mt-auto opacity-75">
                            <ul class="list-unstyled mb-0">
                                <li class="mb-2"><i class="bi bi-check2-square me-2"></i>請點選對應的廠區按鈕進入</li>
                                <li><i class="bi bi-check2-square me-2"></i>進入後即可開始 QR Code 掃描與點收</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth 守門員與身分渲染 -->
    <script src="scripts/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Auth) {
                Auth.renderNavbarUser('#navbarUserArea');
            }
        });
    </script>
</body>

</html>
