<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人員登入 - CPDS 跨廠人員調度與簽到系統</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #eef2f7 0%, #dbe4ee 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .login-card {
            max-width: 420px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .login-header {
            background-color: #0d6efd;
            color: #fff;
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
        }

        .login-header i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .form-floating:focus-within {
            z-index: 2;
        }
    </style>
</head>

<body>

    <div class="container px-3">
        <div class="card login-card mx-auto bg-white">
            <div class="login-header">
                <i class="bi bi-people-fill d-block"></i>
                <h4 class="fw-bold mb-1">CPDS 人員調度系統</h4>
                <div class="text-white-50 small">跨廠人員調度與簽到點收平台</div>
            </div>

            <div class="card-body p-4">
                <!-- 錯誤訊息提示區 -->
                <div class="alert alert-danger d-none py-2 px-3 small" id="loginAlert" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    <span id="loginAlertText">工號或密碼錯誤</span>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="empId" class="form-label small fw-semibold text-secondary">
                            <i class="bi bi-person-badge me-1"></i>員工工號
                        </label>
                        <input type="text" class="form-control form-control-lg" id="empId" placeholder="請輸入工號" required
                            autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold text-secondary">
                            <i class="bi bi-shield-lock me-1"></i>登入密碼
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="請輸入密碼"
                            required>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold" id="btnLogin">
                            <i class="bi bi-box-arrow-in-right me-1"></i> 登入系統
                        </button>
                    </div>
                </form>


            </div>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
    <script>
        // 如果已經登入過且有有效身分，直接跳轉至首頁
        if (Auth.getToken() && Auth.getUser()) {
            window.location.replace('index.html');
        }

        const loginForm = document.getElementById('loginForm');
        const elEmpId = document.getElementById('empId');
        const elPassword = document.getElementById('password');
        const elAlert = document.getElementById('loginAlert');
        const elAlertText = document.getElementById('loginAlertText');
        const btnLogin = document.getElementById('btnLogin');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            elAlert.classList.add('d-none');
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> 驗證中...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        empId: elEmpId.value.trim(),
                        password: elPassword.value
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // 儲存身分資訊 (直接包含 DeptId 與 DeptName)
                    Auth.setAuth(data.token, data.user);
                    // 成功跳轉至 index.html
                    window.location.replace('index.html');
                } else {
                    elAlertText.textContent = data.message || '登入失敗，請檢查員工工號與密碼。';
                    elAlert.classList.remove('d-none');
                }
            } catch (err) {
                console.error('登入異常:', err);
                elAlertText.textContent = '無法連線至後端伺服器，請確認服務已啟動。';
                elAlert.classList.remove('d-none');
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> 登入系統';
            }
        });
    </script>

</body>

</html>
